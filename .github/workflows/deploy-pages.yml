name: Deploy iOS web app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "schedule-data/**"
      - "content/**"
      - "tools/schedules/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/import-schedule-data.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Test web schedule merging
        run: node --test web/tests/*.test.cjs

      - name: Test schedule-data tools
        run: python3 -m unittest discover -s tools/schedules/tests -v

      - name: Validate static schedule tree
        run: python3 tools/schedules/validate_schedule_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a web/. _site/
          cp -a schedule-data _site/schedule-data
          cp -a content _site/content

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
